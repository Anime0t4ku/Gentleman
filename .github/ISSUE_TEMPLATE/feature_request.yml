name: Feature Request
description: Suggest a new feature for Gentleman
title: "[FEATURE] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve Gentleman?

  - type: textarea
    id: feature
    attributes:
      label: Feature Request
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What Problem Would This Solve?
      description: Why would this be useful?

  - type: textarea
    id: context
    attributes:
      label: Additional Context / Screenshots
      description: Add examples, screenshots, or extra details if useful.
