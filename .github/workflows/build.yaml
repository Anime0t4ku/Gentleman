name: Gentleman

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  # ============================================================
  # Windows Build - Gentleman
  # ============================================================
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: Gentleman-Frontend
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Inject ScreenScraper developer credentials
        working-directory: Gentleman-Frontend
        shell: python
        env:
          SCREENSCRAPER: ${{ secrets.SCREENSCRAPER }}
        run: |
          import json
          import os
          from pathlib import Path

          secret = os.environ.get("SCREENSCRAPER", "").strip()
          target = Path("core/metadata.py")

          if not target.exists():
              raise SystemExit("core/metadata.py was not found")

          if not secret:
              print("SCREENSCRAPER secret not available, building without ScreenScraper developer credentials.")
              raise SystemExit(0)

          data = json.loads(secret)
          dev_id = data.get("dev_id", "")
          dev_password = data.get("dev_password", "")

          if not dev_id or not dev_password:
              raise SystemExit("SCREENSCRAPER secret is missing dev_id or dev_password")

          content = target.read_text(encoding="utf-8")
          content = content.replace('SCREENSCRAPER_DEV_ID = ""', f"SCREENSCRAPER_DEV_ID = {dev_id!r}")
          content = content.replace('SCREENSCRAPER_DEV_PASSWORD = ""', f"SCREENSCRAPER_DEV_PASSWORD = {dev_password!r}")

          target.write_text(content, encoding="utf-8")

      - name: List Files
        working-directory: Gentleman-Frontend
        run: |
          pwd
          dir
          dir assets

      - name: Build Executable
        working-directory: Gentleman-Frontend
        run: pyinstaller --clean --onefile --windowed --icon app.ico --add-data "assets;assets" --name Gentleman main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gentleman-Windows-x86_64
          path: Gentleman-Frontend/dist/Gentleman.exe

  # ============================================================
  # Windows Build - Gentleman Updater
  # ============================================================
  build-windows-updater:
    name: Build Windows Updater
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: Gentleman-Updater
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: List Files
        working-directory: Gentleman-Updater
        run: |
          pwd
          dir

      - name: Build Updater Executable
        working-directory: Gentleman-Updater
        run: pyinstaller --clean --onefile --windowed --name Gentleman-Updater gentleman-updater.py

      - name: Upload Windows Updater Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gentleman-Updater-Windows-x86_64
          path: Gentleman-Updater/dist/Gentleman-Updater.exe

  # ============================================================
  # macOS Apple Silicon Build - Gentleman
  # ============================================================
  build-macos-apple-silicon:
    name: Build macOS Apple Silicon App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: Gentleman-Frontend
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Inject ScreenScraper developer credentials
        working-directory: Gentleman-Frontend
        shell: python
        env:
          SCREENSCRAPER: ${{ secrets.SCREENSCRAPER }}
        run: |
          import json
          import os
          from pathlib import Path

          secret = os.environ.get("SCREENSCRAPER", "").strip()
          target = Path("core/metadata.py")

          if not target.exists():
              raise SystemExit("core/metadata.py was not found")

          if not secret:
              print("SCREENSCRAPER secret not available, building without ScreenScraper developer credentials.")
              raise SystemExit(0)

          data = json.loads(secret)
          dev_id = data.get("dev_id", "")
          dev_password = data.get("dev_password", "")

          if not dev_id or not dev_password:
              raise SystemExit("SCREENSCRAPER secret is missing dev_id or dev_password")

          content = target.read_text(encoding="utf-8")
          content = content.replace('SCREENSCRAPER_DEV_ID = ""', f"SCREENSCRAPER_DEV_ID = {dev_id!r}")
          content = content.replace('SCREENSCRAPER_DEV_PASSWORD = ""', f"SCREENSCRAPER_DEV_PASSWORD = {dev_password!r}")

          target.write_text(content, encoding="utf-8")

      - name: Create macOS Icon
        working-directory: Gentleman-Frontend
        run: |
          set -euo pipefail
          python -m pip install pillow
          python3 - <<'PY_ICON'
          from pathlib import Path
          from PIL import Image

          source = Path("app.ico")
          output_dir = Path("build/macos-icon.iconset")
          output_dir.mkdir(parents=True, exist_ok=True)

          if not source.exists():
              raise SystemExit("app.ico was not found")

          with Image.open(source) as img:
              frames = []
              frame_count = getattr(img, "n_frames", 1)
              for index in range(frame_count):
                  try:
                      img.seek(index)
                      frames.append(img.copy().convert("RGBA"))
                  except EOFError:
                      break

          if not frames:
              raise SystemExit("No icon frames could be read from app.ico")

          base = max(frames, key=lambda frame: frame.width * frame.height)
          if base.width != base.height:
              size = max(base.width, base.height)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.paste(base, ((size - base.width) // 2, (size - base.height) // 2), base)
              base = canvas

          sizes = {
              "icon_16x16.png": 16,
              "icon_16x16@2x.png": 32,
              "icon_32x32.png": 32,
              "icon_32x32@2x.png": 64,
              "icon_128x128.png": 128,
              "icon_128x128@2x.png": 256,
              "icon_256x256.png": 256,
              "icon_256x256@2x.png": 512,
              "icon_512x512.png": 512,
              "icon_512x512@2x.png": 1024,
          }

          for filename, size in sizes.items():
              base.resize((size, size), Image.LANCZOS).save(output_dir / filename)
          PY_ICON
          iconutil -c icns "build/macos-icon.iconset" -o "build/Gentleman.icns"

      - name: Build macOS App
        working-directory: Gentleman-Frontend
        run: |
          set -euo pipefail
          pyinstaller --clean --onedir --windowed \
            --icon "build/Gentleman.icns" \
            --add-data "assets:assets" \
            --collect-all PyQt6 \
            --hidden-import pygame \
            --hidden-import psutil \
            --name Gentleman main.py

      - name: Import Apple Developer Certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="temporary-keychain-password"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          export CERTIFICATE_PATH

          python3 - <<'PY_CERT'
          import base64
          import os
          from pathlib import Path
          
          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12"]))
          PY_CERT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign macOS App
        working-directory: Gentleman-Frontend
        run: |
          set -euo pipefail
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application signing identity found."
            security find-identity -v -p codesigning
            exit 1
          fi

          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "dist/Gentleman.app"
          codesign --verify --deep --strict --verbose=2 "dist/Gentleman.app"

      - name: Create macOS DMG
        working-directory: Gentleman-Frontend
        run: |
          set -euo pipefail
          mkdir -p dmg-root
          cp -R "dist/Gentleman.app" "dmg-root/Gentleman.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create -volname "Gentleman" -srcfolder dmg-root -ov -format UDZO "../Gentleman-macOS-Apple-Silicon.dmg"

      - name: Sign macOS DMG
        run: |
          set -euo pipefail
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "Gentleman-macOS-Apple-Silicon.dmg"
          codesign --verify --verbose=2 "Gentleman-macOS-Apple-Silicon.dmg"

      - name: Notarize macOS DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "Gentleman-macOS-Apple-Silicon.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "Gentleman-macOS-Apple-Silicon.dmg"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gentleman-macOS-Apple-Silicon
          path: Gentleman-macOS-Apple-Silicon.dmg

  # ============================================================
  # macOS Apple Silicon Build - Gentleman Updater
  # ============================================================
  build-macos-apple-silicon-updater:
    name: Build macOS Apple Silicon Updater
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: Gentleman-Updater
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Create macOS Updater Icon
        working-directory: Gentleman-Updater
        run: |
          set -euo pipefail
          python -m pip install pillow
          python3 - <<'PY_ICON'
          from pathlib import Path
          from PIL import Image

          source = Path("app.ico")
          if not source.exists():
              source = Path("../Gentleman-Frontend/app.ico")
          output_dir = Path("build/macos-icon.iconset")
          output_dir.mkdir(parents=True, exist_ok=True)

          if not source.exists():
              raise SystemExit("No updater icon found. Expected Gentleman-Updater/app.ico or Gentleman-Frontend/app.ico")

          with Image.open(source) as img:
              frames = []
              frame_count = getattr(img, "n_frames", 1)
              for index in range(frame_count):
                  try:
                      img.seek(index)
                      frames.append(img.copy().convert("RGBA"))
                  except EOFError:
                      break

          if not frames:
              raise SystemExit("No icon frames could be read from icon file")

          base = max(frames, key=lambda frame: frame.width * frame.height)
          if base.width != base.height:
              size = max(base.width, base.height)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.paste(base, ((size - base.width) // 2, (size - base.height) // 2), base)
              base = canvas

          sizes = {
              "icon_16x16.png": 16,
              "icon_16x16@2x.png": 32,
              "icon_32x32.png": 32,
              "icon_32x32@2x.png": 64,
              "icon_128x128.png": 128,
              "icon_128x128@2x.png": 256,
              "icon_256x256.png": 256,
              "icon_256x256@2x.png": 512,
              "icon_512x512.png": 512,
              "icon_512x512@2x.png": 1024,
          }

          for filename, size in sizes.items():
              base.resize((size, size), Image.LANCZOS).save(output_dir / filename)
          PY_ICON
          iconutil -c icns "build/macos-icon.iconset" -o "build/Gentleman-Updater.icns"

      - name: Build macOS Updater App
        working-directory: Gentleman-Updater
        run: |
          set -euo pipefail
          pyinstaller --clean --onedir --windowed \
            --icon "build/Gentleman-Updater.icns" \
            --collect-all PyQt6 \
            --hidden-import pygame \
            --name Gentleman-Updater gentleman-updater.py

      - name: Import Apple Developer Certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="temporary-keychain-password"
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/updater-signing.keychain-db"
          export CERTIFICATE_PATH

          python3 - <<'PY_CERT'
          import base64
          import os
          from pathlib import Path
          
          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12"]))
          PY_CERT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign macOS Updater App
        working-directory: Gentleman-Updater
        run: |
          set -euo pipefail
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application signing identity found."
            security find-identity -v -p codesigning
            exit 1
          fi

          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" "dist/Gentleman-Updater.app"
          codesign --verify --deep --strict --verbose=2 "dist/Gentleman-Updater.app"

      - name: Create macOS Updater DMG
        working-directory: Gentleman-Updater
        run: |
          set -euo pipefail
          mkdir -p dmg-root
          cp -R "dist/Gentleman-Updater.app" "dmg-root/Gentleman-Updater.app"
          ln -s /Applications "dmg-root/Applications"
          hdiutil create -volname "Gentleman Updater" -srcfolder dmg-root -ov -format UDZO "../Gentleman-Updater-macOS-Apple-Silicon.dmg"

      - name: Sign macOS Updater DMG
        run: |
          set -euo pipefail
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "Gentleman-Updater-macOS-Apple-Silicon.dmg"
          codesign --verify --verbose=2 "Gentleman-Updater-macOS-Apple-Silicon.dmg"

      - name: Notarize macOS Updater DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "Gentleman-Updater-macOS-Apple-Silicon.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "Gentleman-Updater-macOS-Apple-Silicon.dmg"

      - name: Upload macOS Updater Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gentleman-Updater-macOS-Apple-Silicon
          path: Gentleman-Updater-macOS-Apple-Silicon.dmg

  # ============================================================
  # Pre-release Creation
  # ============================================================
  release:
    name: Create / Update Pre-release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-windows-updater
      - build-macos-apple-silicon
      - build-macos-apple-silicon-updater
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Zip Windows Build
        run: |
          cd dist
          zip ../Gentleman-Windows-x86_64.zip Gentleman.exe

      - name: Zip Windows Updater
        run: |
          cd dist
          zip ../Gentleman-Updater-Windows-x86_64.zip Gentleman-Updater.exe

      - name: Prepare macOS Release Assets
        run: |
          cp "dist/Gentleman-macOS-Apple-Silicon.dmg" "Gentleman-macOS-Apple-Silicon.dmg"
          cp "dist/Gentleman-Updater-macOS-Apple-Silicon.dmg" "Gentleman-Updater-macOS-Apple-Silicon.dmg"

      - name: Update Git Tag
        run: |
          git tag -f Pre-release
          git push -f origin Pre-release

      - name: Create or Update Release
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          tag: Pre-release
          artifacts: |
            Gentleman-Windows-x86_64.zip
            Gentleman-Updater-Windows-x86_64.zip
            Gentleman-macOS-Apple-Silicon.dmg
            Gentleman-Updater-macOS-Apple-Silicon.dmg
